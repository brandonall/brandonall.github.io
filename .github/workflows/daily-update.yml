name: Daily Catholic Readings Update

on:
  schedule:
    - cron: '0 6 * * *'  # Midnight Central Time (06:00 UTC)
  workflow_dispatch:

jobs:
  update-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run daily update script
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: node updater/update.js

      - name: Commit and safe push changes
        run: |
          git config user.email "bot@users.noreply.github.com"
          git config user.name "Daily Updater Bot"
          git add audio/ data/
          git commit -m "Daily update: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git fetch origin main
          git merge origin/main --allow-unrelated-histories || echo "Merge not needed"
          git push origin HEAD:main
