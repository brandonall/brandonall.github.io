name: Daily Catholic Readings Update

on:
  schedule:
    - cron: '0 6 * * *'  # Runs daily at 06:00 UTC = midnight Central Time
  workflow_dispatch:   # Allows you to run it manually for testing

jobs:
  update-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd updater
          npm init -y
          npm install node-fetch@2 @elevenlabs/elevenlabs-js groq-sdk

      - name: Run daily update script
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node updater/update.js

      - name: Commit and push changes
        run: |
          git config user.name "Daily Updater Bot"
          git config user.email "bot@users.noreply.github.com"
          git add .
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Daily update: $(date +'%Y-%m-%d')"
          git push origin main
