<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Catholic Readings & Reflection</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Daily Mass Readings</h1>
        <p id="date" class="date"></p>
        <p class="subtitle">A simple place to read and reflect on today's Scripture</p>

        <!-- Theme toggle in header -->
        <div class="theme-toggle">
            <button id="themeBtn">Dark Mode</button>
        </div>
    </header>

    <!-- Fixed top bar (appears after scroll) -->
    <div class="fixed-top-bar" id="fixedBar">
        <div class="bar-content">
            <button id="themeToggleBar" class="icon-btn" aria-label="Toggle theme">🌙</button>
            <button id="audioPlayPause" class="icon-btn" aria-label="Play/Pause audio">▶️</button>
        </div>
    </div>

    <div class="content-wrapper">
        <section class="audio-container">
            <h2>Listen to Today's Readings</h2>
            <audio controls preload="metadata" playsinline>
                <source id="audioSource" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
            <p class="audio-note">Voice by ElevenLabs (Brian)</p>
        </section>

        <section id="readings" class="readings-container">
            <h2>Today's Readings</h2>
            <div id="readings-content"></div>
            <p class="source">Readings from <a href="https://bible.usccb.org" target="_blank">USCCB.org</a></p>
        </section>

        <section class="questions-container">
            <h2>Reflection Questions</h2>
            <ul id="questions-list"></ul>
        </section>
    </div>

    <footer>
        <p><a href="https://github.com/brandonall/brandonall.github.io">GitHub Repository</a></p>
        <p style="font-size: 0.8em; color: #888; font-style: italic; margin-top: 20px;">for Frances ♡</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
