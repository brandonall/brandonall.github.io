<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Catholic Readings & Reflection</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Daily Mass Readings</h1>
        <p id="date" class="date"></p>
        <p class="subtitle">A simple place to read and reflect on today's Scripture</p>
    </header>

    <section id="readings" class="readings-container">
        <h2>Today's Readings</h2>
        <div id="readings-content"></div>
        <p class="source">Readings from <a href="https://bible.usccb.org" target="_blank">USCCB.org</a></p>
    </section>

    <section class="audio-container">
    <h2>Listen to Today's Readings</h2>
    
    <div class="custom-audio-player">
        <button id="play-pause-btn" class="play">
            <svg viewBox="0 0 24 24" width="32" height="32">
                <path fill="currentColor" d="M8 5v14l11-7z"/>
            </svg>
        </button>
        
        <div class="progress-container">
            <span id="current-time">0:00</span>
            <div class="progress-bar">
                <div id="progress-fill"></div>
            </div>
            <span id="duration">0:00</span>
        </div>
    </div>
    
    <p class="audio-note">Voice by ElevenLabs (Brian)</p>
    
    <!-- Hidden native audio for actual playback -->
    <audio id="audio-element" preload="metadata">
        <source src="audio/ElevenLabs_2025-12-20T11_45_44_Brian_eleven_v3.mp3" type="audio/mpeg">
    </audio>
    </section>

    <section class="questions-container">
        <h2>Reflection Questions</h2>
        <ul id="questions-list"></ul>
    </section>

    <footer>
        <p><a href="https://github.com/brandonall/brandonall.github.io">GitHub Repository</a></p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
