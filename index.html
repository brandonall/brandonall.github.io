<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Catholic Readings Test</title>
    <style>
        body { font-family: Georgia, serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #f8f9fa; color: #333; line-height: 1.7; }
        header { text-align: center; margin-bottom: 30px; padding: 20px; background: linear-gradient(to bottom, #e3f2fd, #bbdefb); border-radius: 12px; }
        h1 { margin: 0; color: #1e88e5; }
        .date-container { display: flex; align-items: center; justify-content: center; gap: 15px; margin: 10px 0; font-size: 1.2em; font-weight: bold; color: #d81b60; }
        .arrow { background: #1e88e5; color: white; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 1.4em; cursor: pointer; }
        .arrow:hover { background: #1565c0; }
        .arrow:disabled { background: #ccc; cursor: not-allowed; }
        .section { background: white; padding: 30px; margin: 20px 0; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { color: #1e88e5; border-bottom: 2px solid #bbdefb; padding-bottom: 10px; }
        .reading { margin-bottom: 30px; }
        .reading h4 { color: #d81b60; }
        #questions-list { list-style: none; padding: 0; }
        #questions-list li { background: #e3f2fd; padding: 15px; margin-bottom: 15px; border-left: 5px solid #1e88e5; border-radius: 8px; }
        footer { text-align: center; margin-top: 50px; color: #888; font-size: 0.9em; }
    </style>
</head>
<body>
    <header>
        <h1>Daily Catholic Readings</h1>
        <div class="date-container">
            <button class="arrow" id="prevBtn">&lt;</button>
            <span id="date">Loading date...</span>
            <button class="arrow" id="nextBtn">&gt;</button>
        </div>
    </header>

    <section class="section">
        <h2>Readings</h2>
        <div id="readings-content">Loading...</div>
    </section>

    <section class="section">
        <h2>Reflection Questions</h2>
        <ul id="questions-list">Loading...</ul>
    </section>

    <footer>
        <p><a href="https://github.com/brandonall/brandonall.github.io">GitHub Repository</a></p>
        <p style="font-size: 0.8em; color: #888; font-style: italic; margin-top: 20px;">for Frances ♡</p>
    </footer>

    <script>
        const dateEl = document.getElementById('date');
        const readingsContent = document.getElementById('readings-content');
        const questionsList = document.getElementById('questions-list');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        let currentOffset = 0;

        const days = [
            { offset: -1, date: "Wednesday, December 24, 2025", title: "Christmas Eve", readings: "<p>Full Christmas Eve readings here...</p>", questions: ["Question 1 for Dec 24", "Question 2", "Question 3", "Question 4", "Question 5", "Question 6"] },
            { offset: 0, date: "Thursday, December 25, 2025", title: "Christmas Day", readings: "<p>Full Christmas Day readings here...</p>", questions: ["Question 1 for Dec 25", "Question 2", "Question 3", "Question 4", "Question 5", "Question 6"] },
            { offset: 1, date: "Friday, December 26, 2025", title: "St. Stephen", readings: "<p>Full St. Stephen readings here...</p>", questions: ["Question 1 for Dec 26", "Question 2", "Question 3", "Question 4", "Question 5", "Question 6"] }
        ];

        function loadContent() {
            const day = days.find(d => d.offset === currentOffset) || days[1];
            dateEl.textContent = day.date;
            readingsContent.innerHTML = day.readings;
            questionsList.innerHTML = day.questions.map(q => `<li>${q}</li>`).join('');
            prevBtn.disabled = currentOffset <= -1;
            nextBtn.disabled = currentOffset >= 1;
        }

        prevBtn.addEventListener('click', () => {
            currentOffset--;
            loadContent();
        });

        nextBtn.addEventListener('click', () => {
            currentOffset++;
            loadContent();
        });

        loadContent();
    </script>
</body>
</html>
