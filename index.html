<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Catholic Readings & Reflection</title>
    <style>
        body {
            font-family: Georgia, serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #f8f9fa;
            color: #333;
            line-height: 1.7;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(to bottom, #e3f2fd, #bbdefb);
            border-radius: 12px;
        }

        h1 {
            margin: 0;
            color: #1e88e5;
        }

        .date-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 10px 0;
            font-size: 1.2em;
            font-weight: bold;
            color: #d81b60;
        }

        .arrow {
            background: #1e88e5;
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.4em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .arrow:hover {
            background: #1565c0;
        }

        .arrow:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .section {
            background: white;
            padding: 30px;
            margin: 20px 0;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            color: #1e88e5;
            border-bottom: 2px solid #bbdefb;
            padding-bottom: 10px;
        }

        .reading {
            margin-bottom: 30px;
        }

        .reading h4 {
            color: #d81b60;
            margin-bottom: 10px;
        }

        #questions-list {
            list-style: none;
            padding: 0;
        }

        #questions-list li {
            background: #e3f2fd;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 5px solid #1e88e5;
            border-radius: 8px;
        }

        .source {
            font-style: italic;
            text-align: right;
            color: #666;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            color: #888;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <header>
        <h1>Daily Catholic Readings</h1>
        <div class="date-container">
            <button class="arrow" id="prevBtn">&lt;</button>
            <span id="date"></span>
            <button class="arrow" id="nextBtn">&gt;</button>
        </div>
        <p class="subtitle">A simple place to read and reflect on Scripture</p>
    </header>

    <section class="section" id="readings">
        <h2>Today's Readings</h2>
        <div id="readings-content">Loading...</div>
        <p class="source">Readings from <a href="https://bible.usccb.org" target="_blank">USCCB.org</a></p>
    </section>

    <section class="section">
        <h2>Reflection Questions</h2>
        <ul id="questions-list"></ul>
    </section>

    <footer>
        <p><a href="https://github.com/brandonall/brandonall.github.io">GitHub Repository</a></p>
        <p style="font-size: 0.8em; color: #888; font-style: italic; margin-top: 20px;">for Frances ♡</p>
    </footer>

    <script>
        const dateEl = document.getElementById('date');
        const readingsContent = document.getElementById('readings-content');
        const questionsList = document.getElementById('questions-list');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        let currentOffset = 0; // 0 = today, -1 = yesterday, +1 = tomorrow

        // Format date as YYYY-MM-DD
        function formatDate(offset = 0) {
            const d = new Date();
            d.setDate(d.getDate() + offset);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `\( {year}- \){month}-${day}`;
        }

        // Display formatted date
        function updateDateDisplay() {
            const d = new Date();
            d.setDate(d.getDate() + currentOffset);
            dateEl.textContent = d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            prevBtn.disabled = currentOffset <= -1;
            nextBtn.disabled = currentOffset >= 1;
        }

        // Hard-coded readings and questions for 3 days
        const content = {
            '-1': { // Yesterday - Dec 24
                title: "Christmas Eve",
                readings: `
                    <div class="reading">
                        <h4>Reading 1: 2 Samuel 7:1-5, 8b-12, 14a, 16</h4>
                        <p>When King David was settled in his palace...</p>
                    </div>
                    <!-- Add full text here as needed -->
                `,
                questions: [
                    "David wanted to build a house for God... How does God turn our plans around?",
                    "The psalm sings of God's covenant... How do I see His faithfulness?",
                    // ... full 6 questions for Dec 24
                ]
            },
            '0': { // Today - Dec 25
                title: "The Nativity of the Lord – Christmas Day",
                readings: `
                    <div class="reading">
                        <h4>Reading 1: Isaiah 52:7-10</h4>
                        <p>How beautiful upon the mountains...</p>
                    </div>
                    <!-- Full Christmas Day readings here -->
                `,
                questions: [
                    "The Word became flesh... How does the Incarnation make God's love real?",
                    "Isaiah proclaims salvation... What glad tidings is God speaking to me?",
                    "The psalm calls all nations... How can I share Christ's birth joy?",
                    "Hebrews describes Jesus as God's imprint... How do I see God in Jesus?",
                    "The light shines in darkness... What darkness needs God's light?",
                    "Grace and truth came through Jesus... How can I embrace both?"
                ]
            },
            '1': { // Tomorrow - Dec 26
                title: "Feast of St. Stephen, First Martyr",
                readings: `
                    <div class="reading">
                        <h4>Reading 1: Acts 6:8-10; 7:54-60</h4>
                        <p>Stephen, full of grace and power...</p>
                    </div>
                    <!-- Full readings for Dec 26 -->
                `,
                questions: [
                    "Stephen performed wonders... How is God calling me to use my gifts?",
                    "The crowd stoned Stephen... Where is God asking me to forgive?",
                    "Stephen saw Jesus standing... How can I fix my eyes on Jesus?",
                    "The Church chose Stephen... What small acts of service can I do?",
                    "Stephen's face shone... How does the Spirit transform me?",
                    "Martyrs' blood is the seed... What daily sacrifices can I offer?"
                ]
            }
        };

        function loadContent() {
            const key = currentOffset.toString();
            const dayData = content[key] || content['0']; // Fallback to today

            dateEl.textContent = new Date(new Date().setDate(new Date().getDate() + currentOffset)).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

            readingsContent.innerHTML = dayData.readings;
            questionsList.innerHTML = '';
            dayData.questions.forEach(q => {
                const li = document.createElement('li');
                li.textContent = q;
                questionsList.appendChild(li);
            });
        }

        prevBtn.addEventListener('click', () => {
            currentOffset--;
            loadContent();
        });

        nextBtn.addEventListener('click', () => {
            currentOffset++;
            loadContent();
        });

        // Initial load
        loadContent();
    </script>
</body>
</html>
