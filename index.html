<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- The all-important redirect meta tag -->
    <meta http-equiv="refresh" content="0; url=https://daily-mass-readings.com">
    
    <title>Redirecting to Daily Mass Readings</title>
    
    <!-- Basic styling while the redirect happens (very brief) -->
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: #f5f5f5;
            font-family: system-ui, -apple-system, sans-serif;
            display: grid;
            place-items: center;
            color: #333;
        }
        .message {
            text-align: center;
            padding: 2rem;
            max-width: 90%;
        }
        h1 {
            margin: 0 0 1rem 0;
            font-size: 1.8rem;
        }
        p {
            margin: 0;
            font-size: 1.1rem;
        }
        a {
            color: #0066cc;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="message">
        <h1>Redirecting...</h1>
        <p>
            Taking you to <strong><a href="https://daily-mass-readings.com">Daily Mass Readings</a></strong><br>
            <small>(if you are not redirected automatically, click the link above)</small>
        </p>
    </div>
</body>
</html>
