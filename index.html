<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Catholic Readings for Couples</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Daily Mass Readings for Couples</h1>
        <p id="date" class="date"></p>
        <p class="subtitle">Putting faith first, together ❤️</p>
    </header>

    <section id="readings" class="readings-container">
        <h2>Today's Readings</h2>
        <div id="readings-content"></div>
        <p class="source">Readings from <a href="https://bible.usccb.org" target="_blank">USCCB.org</a></p>
    </section>

    <section class="questions-container">
        <h2>Discussion Questions for Us</h2>
        <button id="generate-btn">Generate Questions</button>
        <ul id="questions-list"></ul>
    </section>

    <footer>
        <p>Made with love for Catholic couples | <a href="https://github.com/yourusername/catholic-couple-readings">GitHub Repo</a></p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
