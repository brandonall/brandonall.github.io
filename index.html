<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daily Catholic Readings & Reflection</title>
  <style>
    :root {
      --bg: #f8f9fa;
      --card: white;
      --text: #333;
      --accent: #1e88e5;
      --accent-dark: #1565c0;
      --subtle: #d81b60;
      --shadow: 0 4px 15px rgba(0,0,0,0.08);
      --gradient-start: #e3f2fd;
      --gradient-end: #bbdefb;
    }

    [data-theme="dark"] {
      --bg: #0d1117;
      --card: #161b22;
      --text: #c9d1d9;
      --accent: #58a6ff;
      --accent-dark: #388bfd;
      --subtle: #ff79c6;
      --shadow: 0 4px 15px rgba(0,0,0,0.4);
      --gradient-start: #0d1117;
      --gradient-end: #21262d;
    }

    body {
      font-family: Georgia, serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      transition: background 0.4s, color 0.4s;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      background: linear-gradient(to bottom, var(--gradient-start), var(--gradient-end));
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0;
      color: var(--accent);
    }

    .subtitle {
      font-style: italic;
      color: #888;
    }

    .date-selector {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin: 15px 0;
      font-size: 1.1em;
    }

    .date-item {
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .date-item:hover {
      background: rgba(30,136,229,0.1);
    }

    .date-item.active {
      background: var(--accent);
      color: white;
      font-weight: bold;
    }

    .section {
      background: var(--card);
      padding: 30px;
      margin: 20px 0;
      border-radius: 12px;
      box-shadow: var(--shadow);
      transition: background 0.4s;
    }

    h2 {
      color: var(--accent);
      border-bottom: 2px solid rgba(30,136,229,0.2);
      padding-bottom: 10px;
    }

    .reading {
      margin-bottom: 30px;
    }

    .reading h4 {
      color: var(--subtle);
      margin-bottom: 10px;
    }

    #questions-list {
      list-style: none;
      padding: 0;
    }

    #questions-list li {
      background: rgba(30,136,229,0.1);
      padding: 15px;
      margin-bottom: 15px;
      border-left: 5px solid var(--accent);
      border-radius: 8px;
      font-size: 1.1em;
    }

    .source {
      font-style: italic;
      text-align: right;
      color: #666;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      color: #888;
      font-size: 0.9em;
    }

    footer p {
      margin: 5px 0;
    }

    .theme-toggle {
      text-align: center;
      margin: 20px 0;
    }

    #themeBtn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 1em;
      transition: background 0.3s;
    }

    #themeBtn:hover {
      background: var(--accent-dark);
    }
  </style>
</head>
<body>
  <header>
    <h1>Daily Catholic Readings</h1>
    <p class="subtitle">A simple place to read and reflect on Scripture</p>

    <div class="date-selector" id="dateSelector"></div>

    <div class="theme-toggle">
      <button id="themeBtn">Dark Mode</button>
    </div>
  </header>

  <section class="section" id="readings">
    <h2>Today's Readings</h2>
    <div id="readings-content">Loading...</div>
    <p class="source">Readings from <a href="https://bible.usccb.org" target="_blank">USCCB.org</a></p>
  </section>

  <section class="section">
    <h2>Reflection Questions</h2>
    <ul id="questions-list"></ul>
  </section>

  <footer>
    <p><a href="https://github.com/brandonall/brandonall.github.io">GitHub Repository</a></p>
    <p style="font-size: 0.8em; color: #888; font-style: italic; margin-top: 20px;">for Frances ♡</p>
  </footer>

  <script>
    const SUPABASE_URL = 'https://uqwduixylhlpsxezlsxc.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxd2R1aXh5bGhscHN4ZXpsc3hjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY2OTk0OTcsImV4cCI6MjA4MjI3NTQ5N30.t5Vb8UU1DD2l7SzWV87YDn8vbYIM1sOllPRnMfU6KTk';

    const dateEl = document.getElementById('date');
    const readingsContent = document.getElementById('readings-content');
    const questionsList = document.getElementById('questions-list');
    const dateSelector = document.getElementById('dateSelector');
    const themeBtn = document.getElementById('themeBtn');

    let currentDate = new Date();

    function formatDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `\( {year}- \){month}-${day}`;
    }

    function updateDateSelector() {
      dateSelector.innerHTML = '';

      // Yesterday, Today, Tomorrow
      const days = [-1, 0, 1];
      days.forEach(offset => {
        const d = new Date(currentDate);
        d.setDate(d.getDate() + offset);
        const dateStr = formatDate(d);
        const display = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

        const item = document.createElement('button');
        item.className = 'date-item';
        item.textContent = display;
        if (offset === 0) item.classList.add('active');

        item.addEventListener('click', () => {
          currentDate = d;
          loadContent(dateStr);
          updateDateSelector();
        });

        dateSelector.appendChild(item);
      });
    }

    async function loadContent(dateStr) {
      readingsContent.innerHTML = 'Loading...';
      questionsList.innerHTML = '';

      try {
        const response = await fetch(`\( {SUPABASE_URL}/rest/v1/daily_readings?date=eq. \){dateStr}&select=*`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });

        if (!response.ok) throw new Error(`Supabase error: ${response.status}`);

        const data = await response.json();
        if (data.length === 0) {
          readingsContent.innerHTML = '<p>No data found for this date in the database.</p>';
          return;
        }

        const row = data[0];

        // Display readings
        readingsContent.innerHTML = row.readings_html || '<p>Readings not available.</p>';

        // Display questions
        if (Array.isArray(row.daily_questions)) {
          row.daily_questions.forEach(q => {
            const li = document.createElement('li');
            li.textContent = q;
            questionsList.appendChild(li);
          });
        } else {
          questionsList.innerHTML = '<li>No questions available.</li>';
        }

        // Weekly study (if present)
        if (row.weekly_study) {
          const div = document.createElement('div');
          div.innerHTML = `
            <h3>Weekly Bible Study</h3>
            <p><strong>Commentary:</strong> ${row.weekly_study.commentary || 'N/A'}</p>
          `;
          document.querySelector('#readings').appendChild(div);
        }
      } catch (err) {
        readingsContent.innerHTML = `<p>Error: ${err.message}</p>`;
      }
    }

    // Theme toggle
    themeBtn.addEventListener('click', () => {
      const html = document.documentElement;
      if (html.getAttribute('data-theme') === 'dark') {
        html.removeAttribute('data-theme');
        themeBtn.textContent = 'Dark Mode';
      } else {
        html.setAttribute('data-theme', 'dark');
        themeBtn.textContent = 'Light Mode';
      }
    });

    // Initial load
    const todayStr = formatDate(new Date());
    loadContent(todayStr);
    updateDateSelector();
  </script>
</body>
</html>
