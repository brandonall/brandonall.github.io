<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Catholic Readings & Reflection</title>
    <style>
        body {
            font-family: Georgia, serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #f8f9fa;
            color: #333;
            line-height: 1.7;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(to bottom, #e3f2fd, #bbdefb);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            margin: 0;
            color: #1e88e5;
        }

        .date-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 10px 0;
            font-size: 1.2em;
            font-weight: bold;
            color: #d81b60;
            background: transparent;
        }

        .arrow {
            width: 0;
            height: 0;
            border-top: 18px solid transparent;
            border-bottom: 18px solid transparent;
            cursor: pointer;
            transition: border-color 0.2s;
            background: transparent;
        }

        .arrow.prev {
            border-right: 30px solid #1e88e5;
        }

        .arrow.next {
            border-left: 30px solid #1e88e5;
        }

        .arrow:hover.prev {
            border-right-color: #1565c0;
        }

        .arrow:hover.next {
            border-left-color: #1565c0;
        }

        .arrow:disabled {
            border-right-color: #ccc;
            border-left-color: #ccc;
            cursor: not-allowed;
        }

        .section {
            background: white;
            padding: 30px;
            margin: 20px 0;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            color: #1e88e5;
            border-bottom: 2px solid #bbdefb;
            padding-bottom: 10px;
        }

        .reading {
            margin-bottom: 30px;
        }

        .reading h4 {
            color: #d81b60;
            margin-bottom: 10px;
        }

        #questions-list {
            list-style: none;
            padding: 0;
        }

        #questions-list li {
            background: #e3f2fd;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 5px solid #1e88e5;
            border-radius: 8px;
        }

        .source {
            font-style: italic;
            text-align: right;
            color: #666;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            color: #888;
            font-size: 0.9em;
        }

        footer p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Daily Catholic Readings</h1>
        <div class="date-container">
            <button class="arrow prev" id="prevBtn" aria-label="Previous day"></button>
            <span id="date"></span>
            <button class="arrow next" id="nextBtn" aria-label="Next day"></button>
        </div>
        <p class="subtitle">A simple place to read and reflect on Scripture</p>
    </header>

    <section class="section" id="readings">
        <h2>Today's Readings</h2>
        <div id="readings-content"></div>
        <p class="source">Readings from <a href="https://bible.usccb.org" target="_blank">USCCB.org</a></p>
    </section>

    <section class="section">
        <h2>Reflection Questions</h2>
        <ul id="questions-list"></ul>
    </section>

    <footer>
        <p><a href="https://github.com/brandonall/brandonall.github.io">GitHub Repository</a></p>
        <p style="font-size: 0.8em; color: #888; font-style: italic; margin-top: 20px;">for Frances ♡</p>
    </footer>

    <script>
        const dateEl = document.getElementById('date');
        const readingsContent = document.getElementById('readings-content');
        const questionsList = document.getElementById('questions-list');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        let currentOffset = 0; // 0 = today (Dec 25), -1 = yesterday (Dec 24), +1 = tomorrow (Dec 26)

        const days = [
            { // Yesterday - Dec 24
                date: "Wednesday, December 24, 2025",
                title: "Christmas Eve",
                readings: `
                    <div class="reading">
                        <h4>Reading 1: 2 Samuel 7:1-5, 8b-12, 14a, 16</h4>
                        <p>When King David was settled in his palace,<br>
                        and the LORD had given him rest from his enemies on every side,<br>
                        he said to Nathan the prophet,<br>
                        “Here I am living in a house of cedar,<br>
                        while the ark of God dwells in a tent!”<br>
                        Nathan answered the king,<br>
                        “Go, do whatever you have in mind,<br>
                        for the LORD is with you.”<br>
                        But that night the LORD spoke to Nathan and said:<br>
                        “Go, tell my servant David, ‘Thus says the LORD:<br>
                        Should you build me a house to dwell in?<br>
                        I took you from the pasture, from following the sheep,<br>
                        to be commander of my people Israel.<br>
                        I have been with you wherever you went,<br>
                        and I have destroyed all your enemies before you.<br>
                        I will fix a place for my people Israel;<br>
                        I will plant them so that they may dwell in their place<br>
                        without further disturbance.<br>
                        Neither shall the wicked continue to afflict them as they did of old,<br>
                        since the time I first appointed judges over my people Israel.<br>
                        I will give you rest from all your enemies.<br>
                        The LORD also reveals to you<br>
                        that he will establish a house for you.<br>
                        I will raise up your heir after you, sprung from your loins,<br>
                        and I will make firm his kingdom.<br>
                        I will be a father to him,<br>
                        and he shall be a son to me.<br>
                        Your house and your kingdom shall endure forever before me;<br>
                        your throne shall stand firm forever.’”</p>
                    </div>
                    
                    <div class="reading">
                        <h4>Responsorial Psalm: Psalm 89:2-3, 4-5, 27 and 29</h4>
                        <p>R. Forever I will sing the goodness of the Lord.<br><br>
                        The favors of the LORD I will sing forever;<br>
                        through all generations my mouth shall proclaim your faithfulness.<br>
                        For you have said, “My kindness is established forever”;<br>
                        in heaven you have confirmed your faithfulness.<br><br>
                        R. Forever I will sing the goodness of the Lord.<br><br>
                        “I have made a covenant with my chosen one,<br>
                        I have sworn to David my servant:<br>
                        Forever will I confirm your posterity<br>
                        and establish your throne for all generations.”<br><br>
                        R. Forever I will sing the goodness of the Lord.<br><br>
                        “He shall say of me, ‘You are my father,<br>
                        my God, the rock, my savior.’<br>
                        Forever I will maintain my kindness toward him,<br>
                        and establish my covenant with him.”<br><br>
                        R. Forever I will sing the goodness of the Lord.</p>
                    </div>
                    
                    <div class="reading">
                        <h4>Alleluia</h4>
                        <p>O Radiant Dawn,<br>
                        splendor of eternal light and sun of justice:<br>
                        come and shine on those who sit in darkness<br>
                        and in the shadow of death.</p>
                    </div>
                    
                    <div class="reading">
                        <h4>Gospel: Luke 1:67-79</h4>
                        <p>Zechariah his father, filled with the Holy Spirit, prophesied, saying:<br>
                        “Blessed be the Lord, the God of Israel;<br>
                        for he has come to his people and set them free.<br>
                        He has raised up for us a mighty savior,<br>
                        born of the house of his servant David.<br>
                        Through his prophets he promised of old<br>
                        that he would save us from our enemies,<br>
                        from the hands of all who hate us.<br>
                        He promised to show mercy to our fathers<br>
                        and to remember his holy covenant.<br>
                        This was the oath he swore to our father Abraham:<br>
                        to set us free from the hand of our enemies,<br>
                        free to worship him without fear,<br>
                        holy and righteous in his sight<br>
                        all the days of our life.<br>
                        You, my child, shall be called the prophet of the Most High,<br>
                        for you will go before the Lord to prepare his way,<br>
                        to give his people knowledge of salvation<br>
                        by the forgiveness of their sins.<br>
                        In the tender compassion of our God<br>
                        the dawn from on high shall break upon us,<br>
                        to shine on those who dwell in darkness and the shadow of death,<br>
                        and to guide our feet into the way of peace.”</p>
                    </div>
                `,
                questions: [
                    "David wanted to build a house for God, but God promised to build a house for David. How does God often turn our plans around to give us something greater?",
                    "The psalm sings of God's eternal covenant with David. How do I see God's faithfulness and promises at work in my own life?",
                    "Zechariah's prophecy praises God for raising up a savior. In what ways has God brought salvation or freedom to me this Advent?",
                    "The Benedictus speaks of guiding our feet into the way of peace. What steps can I take today to walk more closely in God's path of peace?",
                    "God promises to be a father to His people. How can I open my heart more to God's fatherly love and care?",
                    "The dawn from on high shall break upon us. What darkness in my life is God inviting me to let His light shine into this Christmas?"
                ]
            },
            { // Today - Dec 25
                date: "Thursday, December 25, 2025",
                title: "The Nativity of the Lord – Christmas Day (Mass During the Day)",
                readings: `
                    <div class="reading">
                        <h4>Reading 1: Isaiah 52:7-10</h4>
                        <p>How beautiful upon the mountains<br>
                        are the feet of him who brings glad tidings,<br>
                        announcing peace, bearing good news,<br>
                        announcing salvation, and saying to Zion,<br>
                        “Your God is King!”<br><br>
                        
                        Hark! Your sentinels raise a cry,<br>
                        together they shout for joy,<br>
                        for they see directly, before their eyes,<br>
                        the LORD restoring Zion.<br>
                        Break out together in song,<br>
                        O ruins of Jerusalem!<br>
                        For the LORD comforts his people,<br>
                        he redeems Jerusalem.<br>
                        The LORD has bared his holy arm<br>
                        in the sight of all the nations;<br>
                        all the ends of the earth will behold<br>
                        the salvation of our God.</p>
                    </div>
                    
                    <div class="reading">
                        <h4>Responsorial Psalm: Psalm 98:1, 2-3, 3-4, 5-6</h4>
                        <p>R. All the ends of the earth have seen the salvation of our God.<br><br>
                        Sing to the LORD a new song,<br>
                        for he has done wondrous deeds;<br>
                        His right hand has won victory for him,<br>
                        his holy arm.<br><br>
                        R. All the ends of the earth have seen the salvation of our God.<br><br>
                        The LORD has made his salvation known:<br>
                        in the sight of the nations he has revealed his justice.<br>
                        He has remembered his kindness and his faithfulness<br>
                        toward the house of Israel.<br><br>
                        R. All the ends of the earth have seen the salvation of our God.<br><br>
                        All the ends of the earth have seen<br>
                        the salvation by our God.<br>
                        Sing joyfully to the LORD, all you lands;<br>
                        break into song; sing praise.<br><br>
                        R. All the ends of the earth have seen the salvation of our God.<br><br>
                        Sing praise to the LORD with the harp,<br>
                        with the harp and melodious song.<br>
                        With trumpets and the sound of the horn<br>
                        sing joyfully before the King, the LORD.<br><br>
                        R. All the ends of the earth have seen the salvation of our God.</p>
                    </div>
                    
                    <div class="reading">
                        <h4>Reading 2: Hebrews 1:1-6</h4>
                        <p>Brothers and sisters:<br>
                        In times past, God spoke in partial and various ways<br>
                        to our ancestors through the prophets;<br>
                        in these last days, he has spoken to us through the Son,<br>
                        whom he made heir of all things<br>
                        and through whom he created the universe,<br>
                        who is the refulgence of his glory,<br>
                        the very imprint of his being,<br>
                        and who sustains all things by his mighty word.<br>
                        When he had accomplished purification from sins,<br>
                        he took his seat at the right hand of the Majesty on high,<br>
                        as far superior to the angels<br>
                        as the name he has inherited is more excellent than theirs.<br><br>
                        
                        For to which of the angels did God ever say:<br>
                        You are my son; this day I have begotten you?<br>
                        Or again:<br>
                        I will be a father to him, and he shall be a son to me?<br>
                        And again, when he leads the firstborn into the world, he says:<br>
                        Let all the angels of God worship him.</p>
                    </div>
                    
                    <div class="reading">
                        <h4>Alleluia</h4>
                        <p>A holy day has dawned upon us.<br>
                        Come, you nations, and adore the Lord.<br>
                        For today a great light has come upon the earth.</p>
                    </div>
                    
                    <div class="reading">
                        <h4>Gospel: John 1:1-18</h4>
                        <p>In the beginning was the Word,<br>
                        and the Word was with God,<br>
                        and the Word was God.<br>
                        He was in the beginning with God.<br>
                        All things came to be through him,<br>
                        and without him nothing came to be.<br>
                        What came to be through him was life,<br>
                        and this life was the light of the human race;<br>
                        the light shines in the darkness,<br>
                        and the darkness has not overcome it.<br><br>
                        
                        A man named John was sent from God.<br>
                        He came for testimony, to testify to the light,<br>
                        so that all might believe through him.<br>
                        He was not the light,<br>
                        but came to testify to the light.<br>
                        The true light, which enlightens everyone, was coming into the world.<br><br>
                        
                        He was in the world,<br>
                        and the world came to be through him,<br>
                        but the world did not know him.<br>
                        He came to what was his own,<br>
                        but his own people did not accept him.<br><br>
                        
                        But to those who did accept him<br>
                        he gave power to become children of God,<br>
                        to those who believe in his name,<br>
                        who were born not by natural generation<br>
                        nor by human choice nor by a man’s decision<br>
                        but of God.<br><br>
                        
                        And the Word became flesh<br>
                        and made his dwelling among us,<br>
                        and we saw his glory,<br>
                        the glory as of the Father’s only Son,<br>
                        full of grace and truth.<br><br>
                        
                        John testified to him and cried out, saying,<br>
                        “This was he of whom I said,<br>
                        ‘The one who is coming after me ranks ahead of me<br>
                        because he existed before me.’”<br>
                        From his fullness we have all received,<br>
                        grace in place of grace,<br>
                        because while the law was given through Moses,<br>
                        grace and truth came through Jesus Christ.<br>
                        No one has ever seen God.<br>
                        The only Son, God, who is at the Father’s side,<br>
                        has revealed him.</p>
                    </div>
                `,
                questions: [
                    "The Word became flesh and dwelt among us. How does the Incarnation make God's love feel more real and personal to me today?",
                    "Isaiah proclaims the good news of salvation. What 'glad tidings' of hope or peace is God speaking into my life this Christmas?",
                    "The psalm calls all nations to see God's salvation. How can I share the joy of Christ's birth with others this season?",
                    "Hebrews describes Jesus as the exact imprint of God's being. In what ways do I see God's nature reflected in Jesus' life and actions?",
                    "The light shines in the darkness, and the darkness has not overcome it. What darkness in my life is God inviting His light to overcome this Christmas?",
                    "The Gospel ends with 'grace and truth came through Jesus Christ.' How can I embrace both grace and truth more deeply in my daily walk with God?"
                ]
            },
            { // Tomorrow - Dec 26
                date: "Friday, December 26, 2025",
                title: "Feast of St. Stephen, First Martyr",
                readings: `
                    <div class="reading">
                        <h4>Reading 1: Acts 6:8-10; 7:54-60</h4>
                        <p>Stephen, full of grace and power,<br>
                        performed great wonders and signs among the people.<br>
                        Certain members of the so-called Synagogue of Freedmen,<br>
                        Cyrenians, Alexandrians,<br>
                        and people from Cilicia and Asia,<br>
                        stood up and argued with Stephen.<br>
                        But they could not withstand the wisdom and the spirit with which he spoke.<br><br>
                        
                        When they heard this, they were infuriated,<br>
                        and they ground their teeth at him.<br>
                        But Stephen, filled with the Holy Spirit,<br>
                        looked up intently to heaven<br>
                        and saw the glory of God and Jesus standing at the right hand of God,<br>
                        and Stephen said,<br>
                        “Behold, I see the heavens opened and the Son of Man<br>
                        standing at the right hand of God.”<br>
                        But they cried out in a loud voice,<br>
                        covered their ears,<br>
                        and rushed upon him together.<br>
                        They threw him out of the city, and began to stone him.<br>
                        The witnesses laid down their cloaks<br>
                        at the feet of a young man named Saul.<br>
                        As they were stoning Stephen, he called out,<br>
                        “Lord Jesus, receive my spirit.”<br>
                        Then he knelt down and cried out in a loud voice,<br>
                        “Lord, do not hold this sin against them”;<br>
                        and when he said this, he fell asleep.</p>
                    </div>
                    
                    <div class="reading">
                        <h4>Responsorial Psalm: Psalm 31:3cd-4, 6 and 8ab, 16bc and 17, 21</h4>
                        <p>R. Into your hands, O Lord, I commend my spirit.<br><br>
                        Be my rock of refuge,<br>
                        a stronghold to give me safety.<br>
                        You are my rock and my fortress;<br>
                        for your name’s sake lead and guide me.<br><br>
                        R. Into your hands, O Lord, I commend my spirit.<br><br>
                        Into your hands I commend my spirit;<br>
                        you will redeem me, O LORD, O faithful God.<br>
                        I will rejoice and be glad of your mercy.<br><br>
                        R. Into your hands, O Lord, I commend my spirit.<br><br>
                        Rescue me from the clutches of my enemies,<br>
                        from the hands of my persecutors.<br>
                        Let your face shine upon your servant;<br>
                        save me in your kindness.<br><br>
                        R. Into your hands, O Lord, I commend my spirit.<br><br>
                        You hide me in the shelter of your presence<br>
                        from the plottings of men;<br>
                        You keep me safe in your tent<br>
                        from the strife of tongues.</p>
                    </div>
                    
                    <div class="reading">
                        <h4>Alleluia</h4>
                        <p>Blessed is he who comes in the name of the Lord;<br>
                        the Lord is God and has given us light.</p>
                    </div>
                    
                    <div class="reading">
                        <h4>Gospel: Matthew 10:17-22</h4>
                        <p>Jesus said to his disciples:<br>
                        “Beware of men, for they will hand you over to courts<br>
                        and scourge you in their synagogues,<br>
                        and you will be led before governors and kings for my sake<br>
                        as a witness before them and the pagans.<br>
                        When they hand you over,<br>
                        do not worry about how you are to speak<br>
                        or what you are to say.<br>
                        You will be given at that moment what you are to say.<br>
                        For it will not be you who speak<br>
                        but the Spirit of your Father speaking through you.<br>
                        Brother will hand over brother to death,<br>
                        and the father his child;<br>
                        children will rise up against parents and have them put to death.<br>
                        You will be hated by all because of my name,<br>
                        but whoever endures to the end will be saved.”</p>
                    </div>
                `,
                questions: [
                    "Stephen, full of grace and power, performed great wonders. How is God calling me to use my gifts boldly for His kingdom?",
                    "The crowd stoned Stephen, yet he prayed for them. Where in my life is God asking me to forgive those who have hurt me?",
                    "Stephen saw the glory of God and Jesus standing at His right hand. How can I keep my eyes fixed on Jesus in times of trial?",
                    "The early Church chose Stephen as a servant. What small acts of service is God inviting me to perform with joy?",
                    "Stephen's face shone like an angel. How does God's Spirit transform my appearance and demeanor when I trust Him fully?",
                    "The blood of martyrs is the seed of the Church. What small martyrdoms (daily sacrifices) can I offer to help grow faith in others?"
                ]
            }
        ];

        function loadContent() {
            const day = days[currentOffset + 1];
            dateEl.textContent = day.date;
            document.querySelector('#readings h2').textContent = day.title;
            document.getElementById('readings-content').innerHTML = day.readings;
            const list = document.getElementById('questions-list');
            list.innerHTML = '';
            day.questions.forEach(q => {
                const li = document.createElement('li');
                li.textContent = q;
                list.appendChild(li);
            });

            prevBtn.disabled = currentOffset <= -1;
            nextBtn.disabled = currentOffset >= 1;
        }

        prevBtn.addEventListener('click', () => {
            currentOffset--;
            loadContent();
        });

        nextBtn.addEventListener('click', () => {
            currentOffset++;
            loadContent();
        });

        // Initial load (today)
        loadContent();
    </script>
</body>
</html>
